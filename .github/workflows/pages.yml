name: Deploy laboratory
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages-enabled: ${{ steps.pages.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check Pages availability
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getPages({owner: context.repo.owner, repo: context.repo.repo});
              return true;
            } catch (error) {
              if (error.status === 404 || error.status === 403) {
                core.notice('Pages is not enabled. Enable Settings → Pages → GitHub Actions to publish. The application build passed.');
                return false;
              }
              throw error;
            }
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.result == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.result == 'true'
        with:
          path: dist
  deploy:
    if: needs.build.outputs.pages-enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
