name: Check laboratory
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: 1
      WEBKIT_DISABLE_DMABUF_RENDERER: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:standalone
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
          retention-days: 7
